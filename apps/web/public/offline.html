<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline – NativeLoc</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
      .mark { width: 64px; height: 64px; border-radius: 16px; background: #0f766e; color: #fff; font-size: 30px;
        display: grid; place-items: center; margin: 0 auto 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #475569; }
      button { font: inherit; padding: 12px 24px; border: 0; border-radius: 10px; background: #0f766e; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">文A</div>
      <h1>You're offline</h1>
      <p>NativeLoc needs a connection to load your cards. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
